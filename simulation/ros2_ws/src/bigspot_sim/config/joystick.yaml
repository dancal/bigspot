# Generic ROS Joy indices. Physical PS4/USB/Bluetooth mapping is unverified.
bigspot_joystick:
  ros__parameters:
    start_button: 0
    stop_button: 1
    jump_button: 2
    run_button: 3
    boost_button: 4
    deadman_button: 5
    bow_button: 6
    crouch_button: 7
    seated_clap_button: 8
    rear_stand_button: -1
    handstand_button: 9
    turn_left_button: 10
    turn_right_button: 11
    dance_button: 12
    cute_button: 13
    dance_action: dance_funk
    cute_action: cute
    forward_axis: 1
    lateral_axis: 0
    yaw_axis: 3
    forward_speed: 0.06
    lateral_speed: 0.05
    yaw_speed: 0.4
    boost_multiplier: 2.5
    run_speed: 0.18
